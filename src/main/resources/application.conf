discord {
  token = ""
  token = ${?DISCORD_TOKEN}
}

db {
  url = "jdbc:postgresql://localhost:5432/sakenomi"
  url = ${?DB_URL}
  user = "postgres"
  user = ${?DB_USER}
  password = "password"
  password = ${?DB_PASSWORD}
}

bot {
  # カテゴリ内チャンネル数の警告閾値
  channel-warn-threshold = 45
  channel-warn-threshold = ${?CHANNEL_WARN_THRESHOLD}

  # 開発用ギルド ID。設定時はグローバル登録ではなくこのギルドにコマンドを即時反映する
  development-guild = null
  development-guild = ${?DEVELOPMENT_GUILD_ID}
}

web {
  discord-client-id = ""
  discord-client-id = ${?DISCORD_CLIENT_ID}
  discord-client-secret = ""
  discord-client-secret = ${?DISCORD_CLIENT_SECRET}
  public-base-url = "http://localhost:8080"
  public-base-url = ${?PUBLIC_BASE_URL}
  # セッション Cookie 暗号化キー(hex 32 桁 = 16byte AES 鍵)。本番では必ず環境変数で上書きすること
  session-encrypt-key = "0123456789abcdef0123456789abcdef"
  session-encrypt-key = ${?SESSION_ENCRYPT_KEY}
  # セッション Cookie 署名キー(hex, 任意長)。本番では必ず環境変数で上書きすること
  session-sign-key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  session-sign-key = ${?SESSION_SIGN_KEY}
  port = 8080
  port = ${?WEB_PORT}
}